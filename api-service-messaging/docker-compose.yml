services:
  messaging-api:
    image: ghcr.io/sundsvallskommun/api-service-messaging:latest
    ports:
      - "8090:8080" 
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application-default.yml
    volumes:
      - ./application-messaging.yml:/app/application-default.yml
    restart: unless-stopped
    networks:
      - dockernet

networks:
  dockernet:
    external: true 
