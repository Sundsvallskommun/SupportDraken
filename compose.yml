    ports:
      - 8086:8080
    volumes:
      - ./config/application-templating.yml:/app/config/application-default.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  data-loader:
    image: mariadb:10.6
    depends_on:
      api-service-messaging-settings:
        condition: service_healthy
      api-service-eventlog:
        condition: service_healthy
      api-service-support-management:
        condition: service_healthy
    volumes:
      - ./config/mockdata/eventlog_mockdata.sql:/config/mockdata/eventlog_mockdata.sql
      - ./config/mockdata/messaging_settings_mockdata.sql:/config/mockdata/messaging_settings_mockdata.sql
      - ./config/mockdata/support_management_mockdata.sql:/config/mockdata/support_management_mockdata.sql
    entrypoint: >
      bash -c "
      echo 'Waiting for databases to be ready.' &&

      until mariadb -h mariadb -uroot -proot messaging_settings -e 'SHOW TABLES;' | grep -q '^flyway_schema_history$'; do
        echo 'Waiting for Flyway in messaging_settings...'
        sleep 1
      done &&
      echo 'Importing test data into messaging_settings...' &&
      mariadb -h mariadb -uroot -proot messaging_settings </config/mockdata/messaging_settings_mockdata.sql &&

      until mariadb -h mariadb -uroot -proot eventlog -e 'SHOW TABLES;' | grep -q '^flyway_schema_history$'; do
        echo 'Waiting for Flyway in eventlog...'
        sleep 1
      done &&
      echo 'Importing test data into eventlog...' &&
      mariadb -h mariadb -uroot -proot eventlog </config/mockdata/eventlog_mockdata.sql &&

      until mariadb -h mariadb -uroot -proot support_management -e 'SHOW TABLES;' | grep -q '^flyway_schema_history$'; do
        echo 'Waiting for Flyway in support_management...'
        sleep 1
      done &&
      echo 'Importing test data into support_management...' &&
      mariadb -h mariadb -uroot -proot support_management </config/mockdata/support_management_mockdata.sql &&

      echo 'All test data imported successfully.'"

volumes:
  supportdraken_data: {}  