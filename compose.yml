services:
  builder:
    build:
      context: builder
      dockerfile: Dockerfile
    profiles: ["build"]
    privileged: true
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.m2:/root/.m2

  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      TZ: Europe/Stockholm
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - supportdraken_data:/var/lib/mysql
      - ./db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    restart: unless-stopped

  api-service-case-data:
    image: ghcr.io/sundsvallskommun/api-service-case-data:latest
    container_name: api-service-case-data
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8091:8080
    volumes:
      - ./config/application-case-data.yml:/app/config/application-default.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-service-eventlog:
    image: ghcr.io/sundsvallskommun/api-service-eventlog:latest
    container_name: api-service-eventlog
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8080:8080
    volumes:
      - ./config/application-eventlog.yml:/app/config/application-default.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-service-message-exchange:
