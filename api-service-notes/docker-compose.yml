services:
  notes-api:
    image: ghcr.io/sundsvallskommun/api-service-notes:latest
    container_name: notes-api
    ports:
      - "8081:8080" 
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application-default.yml
    volumes:
      - ./application-notes.yml:/app/application-default.yml
    restart: unless-stopped
    networks:
      - dockernet

networks:
  dockernet:
    external: true 
