services:
  db-seeder:
    image: mariadb:10.6
    container_name: db-seeder
    # Ingen depends_on behövs; vi väntar i skriptet tills DB svarar.
    networks:
      - dockernet
    environment:
      MARIADB_HOST: mariadb          # alias från din huvud-compose
      MARIADB_ROOT_PASSWORD: root    # samma som i din mariadb-tjänst
    volumes:
      - ./sql:/seed:ro               # seeder/sql -> /seed
      - ./run.sh:/run.sh:ro          # vårt seeder-skript
    entrypoint: ["/bin/sh", "/run.sh"]

networks:
  dockernet:
    external: true