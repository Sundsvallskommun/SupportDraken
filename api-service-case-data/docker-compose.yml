services:
  case-data-api:
    image: ghcr.io/sundsvallskommun/api-service-case-data:latest
    ports:
      - "8091:8080" 
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application-default.yml
    volumes:
      - ./application-case-data.yml:/app/application-default.yml
    restart: unless-stopped
    networks:
      - dockernet

networks:
  dockernet:
    external: true 
