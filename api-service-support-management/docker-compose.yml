services:
  support-management-api:
    image: ghcr.io/sundsvallskommun/api-service-support-management:latest
    ports:
      - "8087:8080" 
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application-default.yml
    volumes:
      - ./application-support-management.yml:/app/application-default.yml
    restart: unless-stopped
    networks:
      - dockernet

networks:
  dockernet:
    external: true 
