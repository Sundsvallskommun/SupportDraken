server {
  listen 8080;
  server_name _;

  # Minimal, explicit mappings. Keep as small as possible so nginx and troubleshooting stay simple.

  # WireMock token endpoint (backend calls http://proxy:8080/token)
  location = /token {
    proxy_pass http://wiremock:8080/token;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Lightweight local health endpoint for nginx/proxy container
  location = /health {
    add_header Content-Type text/plain;
    return 200 'OK';
  }

  # Draken Public Backend (KC) - route /kc/* to web-app-draken-public-backend:3001/kc/*
  location /kc/ {
    proxy_pass http://web-app-draken-public-backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Support Management Admin Backend - route /api/* to web-app-support-management-admin-backend:3003/api/*
  location /api/ {
    proxy_pass http://web-app-support-management-admin-backend:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fake SSO IDP - route /sso to web-app-fake-sso-idp:7001
  location /sso {
    proxy_pass http://web-app-fake-sso-idp:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Support Management service (container)
  # Rewrite requests like /supportmanagement/{version}/{rest...} -> /{rest...}
  # then proxy to the upstream using a static proxy_pass (avoids runtime DNS resolver requirement).
  location ~ ^/supportmanagement(?:/[^/]+)?/(.*)$ {
    rewrite ^/supportmanagement(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://api-service-support-management:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # CaseData service
  # Rewrite /casedata/{version}/{rest...} -> /{rest...} then proxy to container
  location ~ ^/casedata(?:/[^/]+)?/(.*)$ {
    rewrite ^/casedata(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://api-service-case-data:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Templating service
  location ~ ^/templating(?:/[^/]+)?/(.*)$ {
    rewrite ^/templating(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://api-service-templating:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Party service
  location ~ ^/party(?:/[^/]+)?/(.*)$ {
    rewrite ^/party(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://api-service-party:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # CaseStatus service
  location ~ ^/casestatus(?:/[^/]+)?/(.*)$ {
    rewrite ^/casestatus(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://api-service-case-status:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Relations service (container)
  # Rewrite requests like /relations/{version}/{rest...} -> /{rest...}
  # then proxy to the upstream using a static proxy_pass.
  location ~ ^/relations(?:/[^/]+)?/(.*)$ {
    rewrite ^/relations(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://api-service-relations:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Simulator endpoints -> wiremock
  # Simulator endpoints -> wiremock
  # Accept optional version segment and strip it before proxying
  location ~ ^/simulatorserver(?:/[^/]+)?/(.*)$ {
    rewrite ^/simulatorserver(?:/[^/]+)?/(.*)$ /$1 break;
    proxy_pass http://wiremock:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Active Directory mappings -> wiremock
  # Accept optional version segment and remove only that segment before proxying
  # e.g. /activedirectory/2.0/2281/groupmembers/... -> /activedirectory/2281/groupmembers/...
  location ~ ^/activedirectory(?:/[^/]+)?/(.*)$ {
    rewrite ^/activedirectory(?:/[^/]+)?/(.*)$ /activedirectory/$1 break;
    proxy_pass http://wiremock:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /activedirectory { return 301 /activedirectory/; }

  # Citizen service -> wiremock
  # Accept optional version segment and rewrite to WireMock's expected path
  # (WireMock mappings use /api/v3/citizen/... so we add that prefix back)
  location ~ ^/citizen(?:/[^/]+)?/(.*)$ {
    rewrite ^/citizen(?:/[^/]+)?/(.*)$ /api/v3/citizen/$1 break;
    proxy_pass http://wiremock:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /citizen { return 301 /citizen/; }

  # Estateinfo, LegalEntity, Employee -> fall back to WireMock
  # Estateinfo -> wiremock (preserve /estateinfo prefix expected by mappings)
  # e.g. /estateinfo/2.0/2281/estate-data -> /estateinfo/2281/estate-data
  location ~ ^/estateinfo(?:/[^/]+)?/(.*)$ {
    rewrite ^/estateinfo(?:/[^/]+)?/(.*)$ /estateinfo/$1 break;
    proxy_pass http://wiremock:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /estateinfo { return 301 /estateinfo/; }

  # LegalEntity -> wiremock (rewrite to WireMock's /api/v2/legalentity/...)
  # e.g. /legalentity/2.0/ORG/ID -> /api/v2/legalentity/ORG/ID
  location ~ ^/legalentity(?:/[^/]+)?/(.*)$ {
    rewrite ^/legalentity(?:/[^/]+)?/(.*)$ /api/v2/legalentity/$1 break;
    proxy_pass http://wiremock:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /legalentity { return 301 /legalentity/; }

  # Employee -> wiremock (rewrite to WireMock's /api/v2/employee/...)
  # e.g. /employee/2.0/ORG/personid/... -> /api/v2/employee/ORG/personid/...
  location ~ ^/employee(?:/[^/]+)?/(.*)$ {
    rewrite ^/employee(?:/[^/]+)?/(.*)$ /api/v2/employee/$1 break;
    proxy_pass http://wiremock:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /employee { return 301 /employee/; }

  # Fallback: clear error instead of trying to be smart
  location / {
    return 502 "No upstream matched for request";
  }
}
