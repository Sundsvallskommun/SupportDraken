services:
  builder:
    build:
      context: .
      dockerfile: builder/Dockerfile
    profiles: [ "build" ]
    privileged: true
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.m2:/root/.m2

  wiremock:
    image: wiremock/wiremock:3.6.0
    container_name: wiremock
    ports:
      - "9000:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:rw
      - ./wiremock/responses:/home/wiremock/__files:rw
    command:
      - "--verbose"
      - "--global-response-templating"
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost:8080/__admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      TZ: Europe/Stockholm
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - supportdraken_data:/var/lib/mysql
      - ./config/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

  api-service-case-data:
    image: ghcr.io/sundsvallskommun/api-service-case-data:latest
    container_name: api-service-case-data
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8091:8080
    volumes:
      - ./config/backend/application-case-data.yml:/app/config/application-default.yml
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s

  api-service-eventlog:
    image: ghcr.io/sundsvallskommun/api-service-eventlog:latest
    container_name: api-service-eventlog
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8080:8080
    volumes:
      - ./config/backend/application-eventlog.yml:/app/config/application-default.yml
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s

  api-service-access-mapper:
    image: ghcr.io/sundsvallskommun/api-service-access-mapper:latest
    container_name: api-service-access-mapper
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8092:8080
    volumes:
      - ./config/backend/application-access-mapper.yml:/app/config/application-default.yml
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s

  api-service-message-exchange:
    image: ghcr.io/sundsvallskommun/api-service-message-exchange:latest
    container_name: api-service-message-exchange
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8083:8080
    volumes:
      - ./config/backend/application-message-exchange.yml:/app/config/application-default.yml
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost:8080/actuator/health" ]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s

  api-service-case-status:
    image: ghcr.io/sundsvallskommun/api-service-case-status:latest
    container_name: api-service-case-status
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application-default.yml
    ports:
      - 8088:8080
    volumes:
      - ./config/backend/application-case-status.yml:/app/config/application-default.yml
    healthcheck:
      test: [ "CMD", "wget", "-q", "http://localhost:8080/actuator/health" ]
      interval: 20s
