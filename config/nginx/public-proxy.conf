# Public-facing nginx configuration
# Runs inside Docker container and routes to other containers
# replace public.example.com and admin.example.com with your actual domain names
# and update SSL certificate paths as needed

# Draken Public Frontend (HTTP redirect)
server {
  listen 80;
  server_name public.example.com;
  return 301 https://$host$request_uri;
}

# Draken Public Frontend (HTTPS)
server {
  listen 443 ssl;
  server_name public.example.com;

  ssl_certificate     /etc/nginx/certs/draken/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/draken/privkey.pem;

  location /kc/ {
    proxy_pass http://web-app-draken-public-backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://web-app-draken-public-frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # --- Fake IdP under /sso ---
  location ^~ /sso/ {
    proxy_pass http://web-app-fake-sso-idp:7000/;   # trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /sso {
    proxy_pass http://web-app-fake-sso-idp:7000;    # no trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# Admin Frontend (HTTP redirect)
server {
  listen 80;
  server_name admin.example.com;
  return 301 https://$host$request_uri;
}

# Admin Frontend (HTTPS)
server {
  listen 443 ssl;
  server_name admin.example.com;

  ssl_certificate     /etc/nginx/certs/admin/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/admin/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location = / { return 302 /start; }
  location = /api { return 301 /api/; }

  location ^~ /api/ {
    proxy_pass http://web-app-support-management-admin-backend:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://web-app-support-management-admin-frontend:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # --- Fake IdP under /sso ---
  location ^~ /sso/ {
    proxy_pass http://web-app-fake-sso-idp:7000/;   # trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /sso {
    proxy_pass http://web-app-fake-sso-idp:7000;    # no trailing slash
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
