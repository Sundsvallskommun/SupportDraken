services:
  casemanagement-api:
    image: ghcr.io/sundsvallskommun/api-service-casemanagement:latest
    ports:
      - "8093:8080" 
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application-default.yml
    volumes:
      - ./application-casemanagement.yml:/app/application-default.yml
    restart: unless-stopped
    networks:
      - dockernet

networks:
  dockernet:
    external: true 
