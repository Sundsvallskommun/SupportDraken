services:
  email-reader-api:
    image: ghcr.io/sundsvallskommun/api-service-email-reader:latest
    ports:
      - "8085:8080" 
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application-default.yml
    volumes:
      - ./application-email-reader.yml:/app/application-default.yml
    restart: unless-stopped
    networks:
      - dockernet

networks:
  dockernet:
    external: true 
